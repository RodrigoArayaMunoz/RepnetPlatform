services:
  postgres:
    image: postgres:16
    container_name: compat_postgres
    environment:
      POSTGRES_DB: RepnetPlatform
      POSTGRES_USER: repnet
      POSTGRES_PASSWORD: repnet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repnet -d RepnetPlatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: compat_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compat_api
    working_dir: /code
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  worker_dispatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compat_worker_dispatch
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_dispatch --concurrency=1 --loglevel=info

  worker_chunks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compat_worker_chunks
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_chunks --concurrency=1 --loglevel=info

volumes:
  postgres_data: